{% extends "base.html" %}
{% block body %}
<h1>Change password</h1>
<form method="post" class="card form" style="max-width:420px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="stack">
    <label><span>Current password</span><input name="current" type="password" autocomplete="current-password" required></label>
    <label><span>New password</span><input name="new" type="password" autocomplete="new-password" required></label>
    <label><span>New password again</span><input name="again" type="password" autocomplete="new-password" required></label>
  </div>
  <p class="muted">At least 8 characters with letters and numbers.</p>
  <div class="row"><button class="btn primary">Save password</button><a class="btn" href="{{ url_for('home') }}">Cancel</a></div>
</form>
{% endblock %}
